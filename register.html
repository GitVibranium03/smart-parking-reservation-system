<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartPark | Register</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation Bar -->

    <header>

        <nav class="navbar">

            <div class="logo">
                Smart<span>Park</span>
            </div>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#features">Features</a></li>
                <li><a href="booking.html">Book Parking</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>

        </nav>

    </header>


    <!-- Registration Section -->

    <section class="register-section">

        <div class="register-container">

            <h1>Create Your Account</h1>

            <p class="register-subtitle">
                Register to reserve your parking slot.
            </p>


            <form id="registerForm">

                <!-- Name -->

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Phone -->

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        required
                    >

                </div>


                <!-- Vehicle Number -->

                <div class="form-group">

                    <label for="vehicleNumber">
                        Vehicle Number
                    </label>

                    <input
                        type="text"
                        id="vehicleNumber"
                        name="vehicleNumber"
                        placeholder="Example: MH12AB1234"
                        required
                    >

                </div>


                <!-- Vehicle Type -->

                <div class="form-group">

                    <label for="vehicleType">
                        Vehicle Type
                    </label>

                    <select id="vehicleType" name="vehicleType" required>

                        <option value="">
                            Select vehicle type
                        </option>

                        <option value="car">
                            Car
                        </option>

                        <option value="bike">
                            Bike
                        </option>

                        <option value="scooter">
                            Scooter
                        </option>

                    </select>

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <!-- Confirm Password -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <!-- Submit -->

                <button
                    type="submit"
                    class="register-btn"
                >
                    Create Account
                </button>


                <p class="login-link">

                    Already have an account?

                    <a href="login.html">
                        Login here
                    </a>

                </p>

            </form>

        </div>

    </section>


    <footer>

        <p>
            © 2026 SmartPark. Online Parking Reservation System.
        </p>

    </footer>


    <script src="js/script.js"></script>

</body>

</html>
