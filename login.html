<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartPark | Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation Bar -->

    <header>

        <nav class="navbar">

            <div class="logo">
                Smart<span>Park</span>
            </div>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#features">Features</a></li>
                <li><a href="booking.html">Book Parking</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>

        </nav>

    </header>


    <!-- Login Section -->

    <section class="login-section">

        <div class="login-container">

            <h1>Welcome Back</h1>

            <p class="login-subtitle">
                Login to manage your parking bookings.
            </p>


            <form id="loginForm">

                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- Login Button -->

                <button
                    type="submit"
                    class="login-btn"
                >
                    Login
                </button>


                <p class="register-link">

                    Don't have an account?

                    <a href="register.html">
                        Create an account
                    </a>

                </p>

            </form>

        </div>

    </section>


    <!-- Footer -->

    <footer>

        <p>
            © 2026 SmartPark. Online Parking Reservation System.
        </p>

    </footer>


    <script src="js/script.js"></script>

</body>

</html>
